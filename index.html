<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Vamos Ler!</title>
<meta name="theme-color" content="#FF7A59">
<meta name="description" content="Jogo para aprender a ler em português de Portugal, para crianças a partir dos 5 anos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
@font-face{font-family:'Andika';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/andika-400.woff2) format('woff2')}
@font-face{font-family:'Andika';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/andika-700.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/fredoka-500.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/fredoka-600.woff2) format('woff2')}
@font-face{font-family:'Fredoka';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/fredoka-700.woff2) format('woff2')}

:root{
  --bg:#FFF6E6; --ink:#2D2A4A; --muted:#7A7598;
  --orange:#FF7A59; --blue:#3CB4E5; --green:#5DBB63; --purple:#A57FEA; --pink:#F06BA8; --yellow:#FFC93C; --red:#F0546A;
  --shadow:0 6px 0 rgba(45,42,74,.13);
  --shadow-press:0 2px 0 rgba(45,42,74,.13);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;overflow:hidden;
  background-image:radial-gradient(circle at 10% 15%,#FFE7C2 0 60px,transparent 61px),radial-gradient(circle at 92% 85%,#E3F4FC 0 90px,transparent 91px),radial-gradient(circle at 85% 12%,#EAF7E4 0 40px,transparent 41px)}
button{font-family:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;padding:14px 16px 28px;overflow-y:auto;gap:14px}
.screen.active{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.topbar{width:100%;max-width:920px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.topbar h2{margin:0;font-size:clamp(22px,4vw,32px);font-weight:700;text-align:center;flex:1}
.iconbtn{width:62px;height:62px;flex:none;border-radius:20px;border:none;background:#fff;box-shadow:var(--shadow);font-size:30px;display:grid;place-items:center;transition:transform .08s}
.iconbtn:active,.press:active{transform:translateY(4px);box-shadow:var(--shadow-press)}
.starbox{background:#fff;border-radius:999px;padding:8px 18px;font-size:26px;font-weight:700;box-shadow:var(--shadow);white-space:nowrap}
.starbox.pop{animation:pop .5s}
@keyframes pop{50%{transform:scale(1.25)}}

/* INÍCIO */
.hero{display:flex;flex-direction:column;align-items:center;gap:4px;margin-top:2px}
.mascot{font-size:clamp(64px,12vw,100px);line-height:1;border:none;background:none;animation:bob 2.6s ease-in-out infinite;padding:0}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.hero h1{margin:0;font-size:clamp(38px,8vw,64px);letter-spacing:1px;color:var(--orange);text-shadow:0 4px 0 #FFD9C9}
.hero p{margin:0;color:var(--muted);font-size:clamp(16px,2.6vw,20px)}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;width:100%;max-width:900px;margin-top:4px}
@media (min-width:760px){.menu{grid-template-columns:repeat(3,minmax(0,1fr))}}
.menu .card:last-child:nth-child(odd){grid-column:span 2}
.card{border:none;border-radius:28px;padding:18px 12px 16px;box-shadow:0 8px 0 rgba(0,0,0,.14);color:#fff;display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .08s}
.card:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.14)}
.card .big{font-size:clamp(46px,9vw,70px);line-height:1.05;font-family:'Andika',sans-serif;font-weight:700}
.card .lbl{font-size:clamp(18px,3.2vw,24px);font-weight:600}
.c-orange{background:var(--orange)}.c-blue{background:var(--blue)}.c-green{background:var(--green)}.c-purple{background:var(--purple)}.c-pink{background:var(--pink)}
.homebar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:4px}
.pill{border:none;background:#fff;border-radius:999px;padding:12px 20px;font-size:20px;font-weight:600;box-shadow:var(--shadow)}

/* COMUM */
.letterfont{font-family:'Andika',sans-serif;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:920px}
.chip{border:none;background:#fff;border-radius:18px;min-width:62px;height:62px;padding:0 16px;font-size:30px;box-shadow:var(--shadow);font-weight:700}
.chip.small{font-size:19px;font-family:'Fredoka';font-weight:600;height:52px}
.chip.on{background:var(--ink);color:#fff}
.lvl{border:none;background:#fff;border-radius:16px;padding:7px 14px 7px 7px;font-size:18px;font-weight:600;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;height:52px}
.lvl b{background:var(--yellow);border-radius:50%;width:36px;height:36px;display:grid;place-items:center;font-size:20px;color:var(--ink)}
.lvl.on{background:var(--ink);color:#fff}
.famlabel{width:100%;text-align:center;color:var(--muted);font-size:16px;margin:2px 0 -4px}
.dots{display:flex;gap:10px}
.dot{width:20px;height:20px;border-radius:50%;background:#E6DFD2}
.dot.done{background:var(--green)}
.dot.now{background:var(--yellow);transform:scale(1.25)}
.speak{border:none;background:var(--yellow);border-radius:50%;width:96px;height:96px;font-size:46px;box-shadow:0 6px 0 #D9A51E;transition:transform .08s;flex:none}
.speak:active{transform:translateY(4px);box-shadow:0 2px 0 #D9A51E}
.speak.small{width:72px;height:72px;font-size:34px}
.speak.pulse{animation:pulse 1.2s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.12)}}
.hint{margin:0;font-size:clamp(18px,3vw,24px);color:var(--muted);text-align:center}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.vowel{color:var(--red)}
.cons{color:var(--blue)}

/* LETRAS */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:12px;width:100%;max-width:920px}
.ltile{border:none;background:#fff;border-radius:20px;aspect-ratio:1;font-size:clamp(34px,6vw,46px);box-shadow:var(--shadow);color:var(--blue);transition:transform .08s}
.ltile.v{color:var(--red);background:#FFF0F2}
.ltile.sel{outline:5px solid var(--yellow)}
.lpanel{display:flex;align-items:center;gap:22px;background:#fff;border-radius:30px;padding:16px 26px;box-shadow:var(--shadow);min-height:150px;width:100%;max-width:620px;justify-content:center}
.lpanel .bigL{font-size:clamp(84px,16vw,130px);line-height:1}
.lpanel .ex{display:flex;flex-direction:column;align-items:center}
.lpanel .emo{font-size:clamp(56px,11vw,84px);line-height:1.1}
.lpanel .word{font-size:clamp(28px,5vw,40px)}

/* PERGUNTAS */
.qrow{display:flex;align-items:center;gap:16px;justify-content:center;flex-wrap:wrap}
.readword{background:#fff;border-radius:30px;padding:10px 30px;font-size:clamp(52px,12vw,100px);box-shadow:var(--shadow);line-height:1.2}
.readword .sep{color:#CFC6B4;margin:0 .08em}
.options{display:flex;gap:clamp(12px,3vw,24px);flex-wrap:wrap;justify-content:center;margin-top:4px}
.opt{border:none;background:#fff;border-radius:30px;width:clamp(104px,25vw,180px);aspect-ratio:1;font-size:clamp(58px,12vw,104px);box-shadow:0 8px 0 rgba(45,42,74,.14);transition:transform .08s,background .2s}
.options.four .opt{width:clamp(96px,21vw,160px);font-size:clamp(52px,10vw,92px)}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(45,42,74,.14)}
.opt.syl{font-size:clamp(40px,9vw,76px)}
.opt.picopt{font-family:system-ui,sans-serif;font-weight:400}
.opt.right{background:#DDF5D9;outline:6px solid var(--green)}
.opt.fade{opacity:.35}

/* SÍLABAS */
.sylrow{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.sylcard{border:none;background:#fff;border-radius:26px;width:clamp(96px,17vw,140px);height:clamp(96px,17vw,140px);font-size:clamp(40px,8vw,64px);box-shadow:var(--shadow)}
.play{border:none;background:var(--green);color:#fff;border-radius:999px;padding:16px 40px;font-size:28px;font-weight:700;box-shadow:0 6px 0 #3E9445;margin-top:6px}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #3E9445}

/* CONSTRÓI */
.pic{border:none;background:#fff;border-radius:36px;width:clamp(140px,28vw,200px);aspect-ratio:1;font-size:clamp(84px,17vw,130px);box-shadow:var(--shadow);display:grid;place-items:center;position:relative}
.pic::after{content:'🔊';position:absolute;right:-8px;bottom:-8px;font-size:30px;background:var(--yellow);border-radius:50%;width:52px;height:52px;display:grid;place-items:center;box-shadow:0 4px 0 #D9A51E}
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.slot{width:clamp(80px,16vw,124px);height:clamp(80px,16vw,114px);border-radius:22px;border:4px dashed #CFC6B4;display:grid;place-items:center;font-size:clamp(36px,8vw,58px);background:rgba(255,255,255,.5)}
.slots.letters .slot{width:clamp(64px,13vw,96px)}
.slot.filled{border:4px solid var(--green);background:#fff;animation:pop .35s}
.slot.next{border-color:var(--yellow)}
.tiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;min-height:110px}
.tile{border:none;background:#fff;border-radius:22px;width:clamp(80px,16vw,120px);height:clamp(80px,16vw,106px);font-size:clamp(36px,8vw,56px);box-shadow:var(--shadow);transition:transform .08s,opacity .2s}
.tile.used{visibility:hidden}

/* RECOMPENSA */
#reward{justify-content:center}
.rewardbox{background:#fff;border-radius:40px;padding:30px 36px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:14px;max-width:560px;width:100%}
.rewardbox h1{margin:0;font-size:clamp(40px,8vw,60px);color:var(--orange)}
.bigstars{font-size:clamp(56px,12vw,90px);display:flex;gap:8px}
.bigstars span{opacity:0;transform:scale(.2)}
.bigstars span.in{animation:starIn .5s forwards}
.bigstars span.off{filter:grayscale(1);opacity:.25!important}
@keyframes starIn{to{opacity:1;transform:scale(1)}}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.bigbtn{width:84px;height:84px;font-size:40px}
#rNext{width:auto;padding:0 22px;font-size:24px;font-weight:700;background:var(--green);color:#fff;box-shadow:0 6px 0 #3E9445;gap:6px;display:flex}

/* OVERLAY / CONFETTI */
.overlay{position:fixed;inset:0;background:rgba(45,42,74,.45);display:none;align-items:center;justify-content:center;padding:18px;z-index:20}
.overlay.on{display:flex}
.sheet{background:#fff;border-radius:28px;padding:24px 26px;max-width:640px;width:100%;max-height:90vh;overflow:auto;font-size:17px;line-height:1.5;-webkit-user-select:text;user-select:text}
.sheet h3{margin:0 0 8px;font-size:24px}
.sheet ul{padding-left:20px;margin:8px 0}
.sheet .voice{background:#F4F1FA;border-radius:14px;padding:12px 14px;font-size:15px}
.sheet select,.sheet input{-webkit-user-select:auto;user-select:auto}
.confetti{position:fixed;top:-60px;font-size:34px;pointer-events:none;z-index:30;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
.praise{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%) scale(.5);font-size:clamp(40px,9vw,72px);font-weight:700;color:var(--green);text-shadow:0 4px 0 #fff,0 0 30px #fff;pointer-events:none;opacity:0;z-index:25;white-space:nowrap}
.praise.show{animation:praise 1.1s ease forwards}
@keyframes praise{20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1;transform:translate(-50%,-55%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.screen:not(#home){padding-bottom:120px}
#lia{position:fixed;left:10px;bottom:10px;z-index:22;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
body.on-home #lia{display:none}
#liaOwl{font-size:62px;line-height:1;position:relative;pointer-events:auto;cursor:pointer;filter:drop-shadow(0 4px 0 rgba(45,42,74,.15));transition:transform .2s}
#liaBadge{position:absolute;right:-10px;top:-6px;font-size:26px;opacity:0;transition:opacity .2s}
#lia.talk #liaOwl{animation:talk .45s ease-in-out infinite alternate}
@keyframes talk{from{transform:translateY(0) rotate(-4deg)}to{transform:translateY(-6px) rotate(4deg)}}
#lia.happy #liaOwl{animation:hop .35s ease-in-out 3}
#lia.happy #liaBadge,#lia.think #liaBadge{opacity:1}
@keyframes hop{50%{transform:translateY(-26px) scale(1.1)}}
#lia.think #liaOwl{transform:rotate(-14deg)}
#liaBubble{background:#fff;border-radius:20px 20px 20px 4px;padding:10px 16px;font-size:clamp(16px,2.6vw,20px);box-shadow:var(--shadow);max-width:min(460px,calc(100vw - 110px));margin-bottom:34px;opacity:0;transform:translateY(6px) scale(.95);transition:opacity .2s,transform .2s}
#liaBubble.on{opacity:1;transform:none}
#liaBubble b{color:var(--orange);font-family:'Andika',sans-serif;font-size:1.25em}
#home .mascot.talk{animation:talk .45s ease-in-out infinite alternate}
@media (max-width:420px){.menu{gap:12px}.card{padding:14px 8px}.lvl{font-size:16px}}

.langbtn{border:none;background:#fff;border-radius:999px;padding:6px;box-shadow:var(--shadow);display:flex;gap:4px;font-size:17px;font-weight:700}
.langbtn span{padding:8px 12px;border-radius:999px;color:var(--muted)}
.langbtn span.on{background:var(--ink);color:#fff}
.novoice{max-width:620px;background:#FFF0F2;border:3px solid var(--red);border-radius:20px;padding:12px 16px;font-size:17px;line-height:1.4;text-align:center}
.readword.bigletter{font-size:clamp(90px,20vw,150px);padding:0 40px;line-height:1.1}
.readword.bigemoji{font-size:clamp(80px,18vw,130px);font-family:system-ui,sans-serif;padding:6px 26px}
.readword.missing{text-align:center;font-size:clamp(44px,10vw,84px)}
.readword .qemoji{font-family:system-ui,sans-serif;font-size:.9em;line-height:1.1}
.readword .blank{display:inline-block;min-width:1.3em;border-bottom:6px solid var(--yellow);color:transparent;margin:0 .05em}
.readword.sentence{font-size:clamp(30px,6.5vw,56px);padding:14px 26px;max-width:min(760px,92vw);text-align:center;font-family:'Andika',sans-serif}
.opt.wordopt,.options.four .opt.wordopt{font-size:clamp(30px,6.5vw,56px);aspect-ratio:auto;width:auto;min-width:min(42vw,220px);height:clamp(84px,17vw,130px);padding:0 16px}
.sylcard.famword{font-size:clamp(34px,7vw,54px)}
.pic.silent::after{content:'💡'}
.setrow{display:flex;flex-wrap:wrap;gap:12px 22px;margin:12px 0}
.setrow .field{display:flex;gap:10px;align-items:center;font-weight:600}
.setrow input#nameSel{font:inherit;font-size:17px;padding:8px 12px;border-radius:10px;border:2px solid #E6DFD2;width:160px}
.radio{display:inline-flex;gap:6px;align-items:center;font-weight:500;margin-right:10px;cursor:pointer}
.radio.block{display:flex;margin:8px 0}
.radio input{width:20px;height:20px}
</style>
</head>
<body>
<!-- INÍCIO -->
<section id="home" class="screen active">
  <div class="topbar">
    <button class="iconbtn" id="btnParents" aria-label="Pais / Parents">ℹ️</button>
    <button class="langbtn press" id="langBtn" aria-label="Idioma / Language"><span data-l="pt">🇵🇹 PT</span><span data-l="en">🇬🇧 EN</span></button>
    <div class="starbox"><span class="starCount">0</span> ⭐</div>
  </div>
  <div class="hero">
    <button class="mascot" id="mascot" aria-label="Lia">🦉</button>
    <h1 data-ui="title">Vamos Ler!</h1>
    <p data-ui="homeHint"></p>
  </div>
  <div class="menu">
    <button class="card c-orange" data-go="letters"><span class="big"><span class="caseA">A</span> <span class="caseB">B</span></span><span class="lbl" data-ui="cLetters"></span></button>
    <button class="card c-blue" data-go="lquiz"><span class="big">👂</span><span class="lbl" data-ui="cLquiz"></span></button>
    <button class="card c-green" data-go="syl"><span class="big"><span class="caseBA">BA</span></span><span class="lbl" data-ui="cSyl"></span></button>
    <button class="card c-purple" data-go="words"><span class="big">🧩</span><span class="lbl" data-ui="cWords"></span></button>
    <button class="card c-pink" data-go="read"><span class="big">📖</span><span class="lbl" data-ui="cRead"></span></button>
  </div>
  <div id="noVoice" class="novoice" data-uih="noVoice" style="display:none"></div>
  <div class="homebar">
    <button class="pill press" id="btnCase">Aa · <span id="caseLabel"></span></button>
  </div>
</section>

<!-- AS LETRAS -->
<section id="letters" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-home aria-label="Início">🏠</button>
    <h2 data-ui="lettersTitle"></h2>
    <div class="starbox"><span class="starCount">0</span> ⭐</div>
  </div>
  <div class="lpanel" id="lPanel"></div>
  <div class="alpha" id="alpha"></div>
</section>

<!-- PERGUNTAS -->
<section id="quiz" class="screen">
  <div class="topbar">
    <button class="iconbtn" id="quizBack" aria-label="Início">🏠</button>
    <h2 id="quizTitle"></h2>
    <div class="starbox"><span class="starCount">0</span> ⭐</div>
  </div>
  <div class="chips" id="quizChips"></div>
  <div class="dots" id="quizDots"></div>
  <div class="qrow">
    <div class="readword letterfont" id="quizWord" style="display:none"></div>
    <button class="speak" id="quizSpeak" aria-label="Ouvir / Listen">🔊</button>
  </div>
  <div class="options" id="quizOpts"></div>
</section>

<!-- SÍLABAS / FAMÍLIAS -->
<section id="syl" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-home aria-label="Início">🏠</button>
    <h2 data-ui="sylTitle"></h2>
    <div class="starbox"><span class="starCount">0</span> ⭐</div>
  </div>
  <p class="hint" data-ui="sylHint"></p>
  <div class="chips" id="sylFam"></div>
  <p class="famlabel" data-ui="sylHard"></p>
  <div class="chips" id="sylFamHard"></div>
  <div class="sylrow" id="sylRow"></div>
  <button class="play" id="sylPlay" data-ui="play"></button>
</section>

<!-- CONSTRÓI -->
<section id="words" class="screen">
  <div class="topbar">
    <button class="iconbtn" data-home aria-label="Início">🏠</button>
    <h2 data-ui="buildTitle"></h2>
    <div class="starbox"><span class="starCount">0</span> ⭐</div>
  </div>
  <div class="chips" id="wLevels"></div>
  <div class="dots" id="wDots"></div>
  <button class="pic" id="wPic" aria-label="Ouvir / Listen"></button>
  <div class="slots" id="wSlots"></div>
  <div class="tiles" id="wTiles"></div>
</section>

<!-- RECOMPENSA -->
<section id="reward" class="screen">
  <div class="rewardbox">
    <div style="font-size:80px;line-height:1">🦉</div>
    <h1 id="rTitle"></h1>
    <div class="bigstars" id="rStars"><span>⭐</span><span>⭐</span><span>⭐</span></div>
    <div class="row">
      <button class="iconbtn bigbtn" id="rAgain" aria-label="↺">🔁</button>
      <button class="iconbtn bigbtn" id="rNext" data-ui="nextBtn"></button>
      <button class="iconbtn bigbtn" data-home aria-label="Início">🏠</button>
    </div>
  </div>
</section>

<!-- PARA OS PAIS -->
<div class="overlay" id="parents">
  <div class="sheet">
    <h3 data-ui="parentsTitle"></h3>
    <div data-uih="parentsHTML"></div>
    <div class="setrow">
      <label class="field"><span data-ui="nameLabel"></span> <input id="nameSel" maxlength="20"></label>
      <div class="field"><span data-ui="roundLabel"></span>
        <label class="radio"><input type="radio" name="round" value="5"> 5</label>
        <label class="radio"><input type="radio" name="round" value="10"> 10</label>
      </div>
    </div>
    <div class="voice">
      <b data-ui="voiceTitle"></b>
      <label class="radio block"><input type="radio" name="vm" value="natural" id="vmNatural"> <span data-ui="voiceNatural"></span><small id="vmNaturalOff"></small></label>
      <label class="radio block"><input type="radio" name="vm" value="device" id="vmDevice"> <span data-ui="voiceDevice"></span></label>
      <div id="deviceOpts">

const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const store = {
  get(k, d) { try { const v = localStorage.getItem('vamosler_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

const CONFUSABLE = [['b','d','p','q'],['m','n','u','h'],['a','e','o','c'],['i','l','j','t'],['f','t','l','k'],['v','w','y','x'],['s','z','c','r'],['g','q','p','j']];
// "gato🐱" → { u:['g','a','t','o'], e:'🐱' }
function parseWord(x) {
  if (typeof x === 'object') return x;

}
// prepara os dados derivados de cada pacote
for (const p of Object.values(PACKS)) {
  p.names = Object.assign(Object.fromEntries(p.letters.map(l => [l[0], l[1]])), p.extraNames);
  for (const k of Object.keys(p.words)) p.words[k] = p.words[k].map(parseWord);
  p.words.w12 = [...p.words.w1, ...p.words.w2];
  if (p.mode === 'syllables') {
    p.allSyl = uniq(['w1','w2','w3'].flatMap(k => p.words[k].flatMap(w => w.u)));
    p.hardSyl = [...p.hardFam.flatMap(f => VOWELS.map(v => f + v)).filter(s => !['lhi','lhu','nhi','nhu'].includes(s)), ...p.extraHardSyl];

}

/* Partes de fala:
   'texto'                  → frase normal
   T('gato')                → palavra-alvo: dita mais devagar e à parte
   N('Muito bem!')          → frase a que se pode juntar o nome da criança no balão (e na voz do dispositivo) */
const T = s => ({ t: s, target: true });
const STRESS = { a:'á', e:'é', o:'ó' };
// sílaba dita sozinha: acentuar a vogal para não soar átona ("me" → "mé")

/* ---------- Voz: áudio gravado (natural) ou voz do dispositivo ---------- */
let voiceMode = store.get('voiceMode', 'natural');
const audioPacks = {};           // idioma → { chave: base64 mp3 } | null (falhou) | undefined (a carregar)
const bufCache = {};

window.__missing = new Set();
async function loadAudio(l) {
  if (audioPacks[l] !== undefined || audioPacks['_' + l]) return;

  try {
    const r = await fetch('audio/' + l + '.json');
    if (!r.ok) throw new Error(r.status);
    audioPacks[l] = await r.json();
  } catch (e) { audioPacks[l] = null; }
  refreshVoiceBanner();
  if ($('#parents').classList.contains('on')) renderVoiceSettings();
}
const naturalReady = () => !!audioPacks[lang];
const useNatural = () => voiceMode === 'natural' && naturalReady();
const hasDevice = () => !!window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined';

let actx;
function ctx() { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
document.addEventListener('pointerdown', () => { try { const c = ctx(); if (c.state === 'suspended') c.resume(); } catch (e) {} }, true);
let curSrc = null;
function b64buf(b64) { const bin = atob(b64), a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return a.buffer; }
async function playClip(key, token) {
  const c = ctx();
  if (c.state === 'suspended') { try { await Promise.race([c.resume(), wait(400)]); } catch (e) {} }
  let buf = bufCache[lang + key];
  if (!buf) {
    buf = await new Promise((res, rej) => c.decodeAudioData(b64buf(audioPacks[lang][key]), res, rej));
    bufCache[lang + key] = buf;
  }
  if (token !== speakToken) return;
  await new Promise(res => {
    const s = c.createBufferSource(); s.buffer = buf; s.connect(c.destination);
    s.onended = res; curSrc = s; s.start();
    setTimeout(res, buf.duration * 1000 + 400);
  });
}

// voz do dispositivo
let voice = null;
let voiceRate = store.get('rate', 0.95);
const isLangVoice = v => lang === 'pt' ? (/^(pt|por)\b|^(pt|por)[-_]/i.test(v.lang) || /portugu/i.test(v.name)) : /^en/i.test(v.lang);
function voiceScore(v) {
  let s = 0;
  if (lang === 'pt' ? (/(pt|por)[-_](pt|prt)/i.test(v.lang) || /portugal/i.test(v.name)) : /en[-_](gb|uk)/i.test(v.lang)) s += 100; else s += 10;
  if (/natural|neural|online|premium|enhanced/i.test(v.name)) s += 20;
  if (v.localService === false) s += 15;
  if (/google|microsoft/i.test(v.name)) s += 5;
  return s;
}
function allVoices() { try { return speechSynthesis.getVoices() || []; } catch (e) { return []; } }
function langVoices() { return allVoices().filter(isLangVoice).sort((a, b) => voiceScore(b) - voiceScore(a)); }
function pickVoice() {
  const vs = langVoices(), saved = store.get('voiceURI_' + lang, null);
  voice = vs.find(v => v.voiceURI === saved) || vs[0] || null;
  if ($('#parents') && $('#parents').classList.contains('on')) renderVoiceSettings();
}
if (hasDevice()) {
  pickVoice();
  try { speechSynthesis.addEventListener('voiceschanged', pickVoice); } catch (e) {}
  let tries = 0; const poll = setInterval(() => { pickVoice(); if (voice || ++tries > 20) clearInterval(poll); }, 500);
}
const liveUtterances = [];
function speakDevice(text, target, token) {
  return new Promise(res => {
    let done = false; const fin = () => { if (!done) { done = true; res(); } };
    try {
      const u = new SpeechSynthesisUtterance(target ? text + '.' : text);
      u.lang = voice ? voice.lang : P.code; if (voice) u.voice = voice;
      u.rate = target ? Math.max(0.5, voiceRate * 0.85) : voiceRate; u.pitch = 1;
      u.onend = fin; u.onerror = fin; liveUtterances.push(u);
      if (liveUtterances.length > 30) liveUtterances.splice(0, 10);
      if (token !== speakToken) return fin();
      speechSynthesis.speak(u);
      setTimeout(fin, 2000 + text.length * 120 / voiceRate);
    } catch (e) { fin(); }
  });
}

/* ---------- Falar ---------- */
let speakToken = 0;
function say(parts, onend) {
  parts = (Array.isArray(parts) ? parts : [parts]).flat().filter(Boolean);
  const token = ++speakToken;
  try { if (curSrc) curSrc.stop(); } catch (e) {}
  if (hasDevice()) try { speechSynthesis.cancel(); } catch (e) {}
  const natural = useNatural();
  // na voz do dispositivo, juntar frases seguidas numa só fala soa mais natural
  if (!natural) {
    const merged = [];
    parts.forEach(p => {
      const last = merged[merged.length - 1];
      if (typeof p === 'string' && typeof last === 'string') merged[merged.length - 1] = last + ' ' + p; else merged.push(p);
    });
    parts = merged;
  }
  (async () => {
    await wait(60);
    if (!natural && hasDevice()) { try { const u = new SpeechSynthesisUtterance('.'); u.volume = 0; liveUtterances.push(u); speechSynthesis.speak(u); } catch (e) {} }
    for (const p of parts) {
      if (token !== speakToken) return;
      const isObj = typeof p === 'object', text = isObj ? p.t : p, shown = isObj && p.show ? p.show : text;
      liaShow(isObj && p.target ? `<b>${esc(text)}</b>` : esc(shown));
      const key = keyOf(p);
      try {
        if (natural && audioPacks[lang][key]) await playClip(key, token);
        else {
          if (natural) window.__missing.add(lang + ' ' + key);
          if (hasDevice()) await speakDevice(isObj && !p.target ? shown : text, isObj && p.target, token);
          else await wait(800 + text.length * 45);
        }
      } catch (e) { await wait(300); }
      if (token !== speakToken) return;
      await wait(natural ? 110 : 0);
    }
    if (token !== speakToken) return;
    liaQuiet();
    onend && onend();
  })();
}
function stopSpeech() {
  speakToken++; idleStop();
  try { if (curSrc) curSrc.stop(); } catch (e) {}
  if (hasDevice()) try { speechSynthesis.cancel(); } catch (e) {}
  liaQuiet(0);
}

/* ---------- Efeitos sonoros ---------- */
function tones(freqs, dur = .11, type = 'triangle', gain = .14) {
  try {
    const c = ctx();
    freqs.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.value = f;
      const t = c.currentTime + i * dur;
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .02);
      g.gain.exponentialRampToValueAtTime(.001, t + dur * 1.8);
      o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur * 2);
    });
  } catch (e) {}
}
const sfxGood = () => tones([523, 659, 784, 1047]);
const sfxBad = () => tones([330, 262], .16, 'sine', .1);

function roundAnswers(pool) {

  $('#quizTitle').textContent = cfg.title;
  show('quiz');
  levelBar($('#quizChips'), cfg.levels, cfg.level, cfg.onLevel, cfg.back);
  renderQuestion(false);
  idleCount = 0;
  say(cfg.intro, () => askQuestion());
}
function renderQuestion(andAsk = true) {
  const q = quiz.questions[quiz.i];
  dots($('#quizDots'), ROUND, quiz.i);
  const w = $('#quizWord');
  w.style.display = q.show ? '' : 'none'; w.className = 'readword letterfont' + (q.showClass ? ' ' + q.showClass : ''); w.innerHTML = q.show || '';
  $('#quizSpeak').textContent = q.help ? '💡' : '🔊';
  $('#quizSpeak').classList.toggle('small', !!q.show);
  const box = $('#quizOpts'); box.innerHTML = '';
  box.classList.toggle('four', q.options.length > 3);
  const disp = q.lower ? s => s.toLowerCase() : D;
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'opt ' + ({ pic: 'picopt', syl: 'letterfont syl', word: 'letterfont wordopt', letter: 'letterfont' }[q.kind]);
    b.innerHTML = q.kind === 'pic' ? opt.e : colorChars(opt, disp);
    b.onclick = () => answer(b, opt);
    box.appendChild(b);
  });
  quiz.locked = false;
  if (andAsk) askQuestion();
}
function askQuestion() {
  if (!quiz) return;
  const q = quiz.questions[quiz.i];
  const sp = $('#quizSpeak'); sp.classList.remove('pulse'); void sp.offsetWidth; sp.classList.add('pulse');
  say(q.prompt, () => idleStart(() => quiz && quiz.questions[quiz.i].prompt));
}
$('#quizSpeak').onclick = () => { if (!quiz) return; const q = quiz.questions[quiz.i]; idleStop(); say(q.help || q.prompt); };
$('#quizBack').onclick = () => { quiz = null; show('home'); };
function answer(btn, opt) {
  if (!quiz || quiz.locked) return;
  const q = quiz.questions[quiz.i];
  idleStop(); idleCount = 0;
  if (opt === q.answer) {
    quiz.locked = true;
    quiz.streak = q.missed ? 0 : quiz.streak + 1;
    liaMood('happy'); btn.classList.add('right');
    $$('#quizOpts .opt').forEach(o => { if (o !== btn) o.classList.add('fade'); });
    sfxGood(); const p = praiseText(); praiseFx(showText(p));
    const extra = quiz.streak > 0 && quiz.streak % 3 === 0 ? pick(P.say.streak) : null;
    setTimeout(() => say([q.echo, p, extra], () => setTimeout(nextQuestion, 300)), 300);
  } else {
    quiz.mistakes++; q.missed = true; quiz.streak = 0; shake(btn); sfxBad(); liaMood('think');
    setTimeout(() => say(q.retry ? q.retry() : [pick(P.say.retry), q.prompt], () => idleStart(() => quiz && q.prompt)), 250);
  }
}
function nextQuestion() {
  if (!quiz) return;
  quiz.i++;
  if (quiz.i >= ROUND) { const q = quiz; quiz = null; finish(q.mistakes, q.again, q.next); return; }
  renderQuestion(false);
  say(pick(P.say.next), () => askQuestion());
}
const distinct = (a, pool, n, eq = (x, y) => x === y) => shuffle(pool.filter(x => !eq(x, a))).slice(0, n);

/* ---------- 2. Que letra é? ---------- */
let lqLevel = store.get('lqLevel', 1);
function firstLetterPool() {
  // palavras cujo primeiro som corresponde à primeira letra (sem dígrafos nem letras mudas)
  const bad = lang === 'pt' ? /^(ch|lh|nh|qu|h)/ : /^(sh|ch|th|wh|qu|kn)/;
  const ws = [...P.words.w1, ...P.words.w2, ...(P.words.w3 || []), ...P.words.spell || []].map(w => ({ w: wordOf(w), e: w.e }))
    .concat(P.letters.filter(l => !'hkwxy'.includes(l[0])).map(l => ({ w: l[2], e: l[3] })));
  const seen = new Set();
  return ws.filter(x => !bad.test(x.w) && /^[a-z]/.test(x.w) && !seen.has(x.e) && seen.add(x.e));
}
function openLetterQuiz(level = lqLevel) {
  const levels = P.levels.lquiz;
  level = Math.min(level, levels.length);
  lqLevel = level; store.set('lqLevel', level);
  const all = P.letters.map(l => l[0]);
  startQuiz({
    title: P.ui.cLquiz, levels, level, onLevel: openLetterQuiz,
    intro: levelIntro(levels[level - 1], level, levels[level - 1].instr),
    again: () => openLetterQuiz(level), next: level < levels.length ? () => openLetterQuiz(level + 1) : null,
    make: () => {
      const q = (a, options, extra = {}) => Object.assign({ answer: a, options, kind: 'letter', prompt: [P.say.findLetter, T(nameOf(a))], echo: T(nameOf(a)) }, extra);
      if (level === 4) return roundAnswers(CONFUSABLE).map(g => q(pick(g), shuffle(g), { lower: true }));
      if (level === 5) return roundAnswers(all).map(a => q(a, shuffle([a, ...distinct(a, all, 3)]), {
        lower: true, show: `<span class="${VOWELS.includes(a) ? 'vowel' : 'cons'}">${a.toUpperCase()}</span>`, showClass: 'bigletter',
        prompt: [P.say.findSmall] }));
      if (level === 6) return shuffle(firstLetterPool()).slice(0, ROUND).map(x => {
        const a = x.w[0];
        return q(a, shuffle([a, ...distinct(a, all.filter(l => !'hkqwxy'.includes(l)), 3)]), {
          show: x.e, showClass: 'bigemoji', prompt: [P.say.startsWith, T(x.w)], echo: [T(x.w), T(nameOf(a))] });
      });
      const pool = level === 1 ? VOWELS : level === 2 ? P.easy : all;
      const n = level === 3 ? 4 : 3;
      return roundAnswers(pool).map(a => q(a, shuffle([a, ...distinct(a, pool, n - 1)])));
    }
  });
}

/* ---------- 3. Sílabas (pt) / Famílias de palavras (en) ---------- */
let sylFam = store.get('sylFam_' + lang, null);
function famChips(container, fams, label = f => D(f)) {
  container.innerHTML = '';
  fams.forEach(f => {
    const b = document.createElement('button');
    b.className = 'chip letterfont press cons' + (f === sylFam ? ' on' : '');
    b.textContent = label(f);
    b.onclick = () => { sylFam = f; store.set('sylFam_' + lang, f); sfxTap(); openSyl(); say(P.mode === 'syllables' ? T(nameOf(f)) : T(f)); };
    container.appendChild(b);
  });
}
function openSyl() {
  const row = $('#sylRow'); row.innerHTML = '';
  if (P.mode === 'syllables') {
    if (!P.easy.includes(sylFam) && !P.hardFam.includes(sylFam)) sylFam = 'm';
    famChips($('#sylFam'), P.easy); famChips($('#sylFamHard'), P.hardFam);
    $('#sylFamHard').style.display = ''; $('.famlabel').style.display = '';
    VOWELS.forEach(v => {
      const s = sylFam + v;
      if (['lhi','lhu','nhi','nhu'].includes(s)) return;
      const b = document.createElement('button');
      b.className = 'sylcard letterfont press'; b.innerHTML = colorChars(s);
      b.onclick = () => say([T(nameOf(sylFam)), T(VOWEL_SOUND[v]), T(sylSpeech(s))]);
      row.appendChild(b);
    });
  } else {
    if (!P.families[sylFam]) sylFam = 'at';
    famChips($('#sylFam'), Object.keys(P.families), f => '-' + D(f));
    $('#sylFamHard').style.display = 'none'; $('.famlabel').style.display = 'none';
    P.families[sylFam].forEach(w => {
      const b = document.createElement('button');
      b.className = 'sylcard letterfont press famword'; b.innerHTML = colorChars(w);
      b.onclick = () => say([T(nameOf(w[0])), T(sylFam), T(w)]);
      row.appendChild(b);
    });
  }
  if (!$('#syl').classList.contains('active')) { show('syl'); say(P.say.sylExplore); }
}
$('#sylPlay').onclick = () => { sfxTap(); openSylQuiz(); };
let sqLevel = store.get('sqLevel', 1);
function missingQuestion() {
  // palavra com uma parte em falta (pt: sílaba; en: vogal do meio)
  if (P.mode === 'syllables') {
    const w = pick([...P.words.w1, ...P.words.w2]), k = Math.floor(Math.random() * w.u.length), a = w.u[k];
    const near = shuffle(P.allSyl.filter(s => s !== a && !w.u.includes(s) && (s[0] === a[0] || s.slice(-1) === a.slice(-1))));
    const opts = uniq([...near, ...shuffle(P.allSyl)].filter(s => s !== a && !w.u.includes(s))).slice(0, 2);
    return { answer: a, options: shuffle([a, ...opts]), kind: 'syl', w, k };
  }
  const w = pick(P.words.w1.filter(x => x.u.length === 3 && VOWELS.includes(x.u[1]))), k = 1, a = w.u[1];
  return { answer: a, options: shuffle([a, ...distinct(a, VOWELS, 2)]), kind: 'letter', w, k };
}
function openSylQuiz(level = sqLevel) {
  const levels = P.levels.syl;
  level = Math.min(level, levels.length);
  sqLevel = level; store.set('sqLevel', level);
  const syl = P.mode === 'syllables';
  const say1 = a => syl ? T(sylSpeech(a)) : T(a);
  const q = (a, options) => ({ answer: a, options, kind: syl ? 'syl' : 'word', prompt: [P.say.findSyl, say1(a)], echo: say1(a) });
  startQuiz({
    title: P.ui.sylQuizTitle, levels, level, onLevel: openSylQuiz,
    back: { label: P.ui.back, fn: () => { quiz = null; openSyl(); } },
    intro: levelIntro(levels[level - 1], level, levels[level - 1].instr),
    again: () => openSylQuiz(level), next: level < levels.length ? () => openSylQuiz(level + 1) : null,
    make: () => {
      if (level === 4) return Array.from({ length: ROUND }, () => {
        const m = missingQuestion(), word = wordOf(m.w);
        const show = `<div class="qemoji">${m.w.e}</div><div>${m.w.u.map((u, i) => i === m.k ? '<span class="blank">' + (syl ? '_ _' : '_') + '</span>' : colorChars(u)).join(syl ? '<span class="sep"> </span>' : '')}</div>`;
        return { answer: m.answer, options: m.options, kind: m.kind, show, showClass: 'missing', prompt: [P.say.missing, T(word)],
                 echo: [syl ? T(sylSpeech(m.answer)) : T(nameOf(m.answer)), T(word)] };
      });
      if (syl) {
        const fam = sylFam && (P.easy.includes(sylFam) || P.hardFam.includes(sylFam)) ? sylFam : 'm';
        if (level === 1) {
          const all = VOWELS.map(v => fam + v).filter(s => !['lhi','lhu','nhi','nhu'].includes(s));
          return roundAnswers(all).map(a => q(a, shuffle([a, ...distinct(a, all, 2)])));
        }
        if (level === 2) return Array.from({ length: ROUND }, () => { const v = pick(VOWELS), cs = shuffle(P.easy).slice(0, 3); return q(cs[0] + v, shuffle(cs.map(c => c + v))); });
        return roundAnswers(P.hardSyl).map(a => {
          const near = uniq(shuffle([...P.hardSyl, ...P.allSyl].filter(s => s !== a && (s.slice(-1) === a.slice(-1) || s[0] === a[0]))));
          return q(a, shuffle([a, ...near.slice(0, 3)]));
        });
      }
      // inglês
      if (level === 1) {
        const fam = P.families[sylFam] ? sylFam : 'at', all = P.families[fam];
        return roundAnswers(all).map(a => q(a, shuffle([a, ...distinct(a, all, 2)])));
      }
      if (level === 2) {
        const byStart = {}; P.famWords.forEach(w => (byStart[w[0]] = byStart[w[0]] || []).push(w));
        const starts = Object.keys(byStart).filter(k => byStart[k].length >= 3);
        return Array.from({ length: ROUND }, () => { const g = byStart[pick(starts)], a = pick(g); return q(a, shuffle([a, ...distinct(a, g, 2)])); });
      }
      const dw = P.digraphWords;
      return roundAnswers(dw).map(a => {
        const near = shuffle(dw.filter(w => w !== a && (w.slice(0, 2) === a.slice(0, 2) || w.slice(-2) === a.slice(-2) || w.slice(1) === a.slice(1))));
        return q(a, shuffle([a, ...(near.length >= 3 ? near : [...near, ...distinct(a, dw, 3)]).filter((x, i, arr) => arr.indexOf(x) === i).slice(0, 3)]));
      });
    }
  });
}

/* ---------- 4. Constrói a palavra ---------- */
let bLevel = store.get('bLevel', 1);
let wr = null;
function openWords(level = bLevel) {
  const levels = P.levels.build;
  level = Math.min(level, levels.length);
  bLevel = level; store.set('bLevel', level);
  levelBar($('#wLevels'), levels, level, openWords);
  const cfg = levels[level - 1];
  wr = { level, cfg, list: shuffle(P.words[cfg.pool]).slice(0, ROUND), i: 0, mistakes: 0, letters: cfg.unit === 'letter' };
  while (wr.list.length < ROUND) wr.list.push(pick(P.words[cfg.pool]));
  show('words');
  renderWord(true);
}
const unitSpeech = u => wr && wr.letters ? T(nameOf(u)) : T(sylSpeech(u));
function distractors(units) {
  const n = wr.cfg.extra;
  if (wr.letters) {
    const chunkPool = P.chunks ? Object.keys(P.chunks) : [];
    const multi = units.filter(u => u.length > 1);
    const near = uniq([...units.flatMap(u => CONFUSABLE.find(g => g.includes(u)) || []), ...(multi.length ? chunkPool : [])]).filter(x => !units.includes(x));
    const rest = P.letters.map(l => l[0]).filter(x => !units.includes(x));
    return shuffle(near.length >= n ? near : [...near, ...rest]).slice(0, n);
  }
  const cands = P.allSyl.filter(s => !units.includes(s));
  if (n === 1) return [pick(cands)];
  const near = cands.filter(s => units.some(u => u[0] === s[0] || u.slice(-1) === s.slice(-1)));
  return shuffle(near.length >= n ? near : cands).slice(0, n);
}
function renderWord(first) {
  const w = wr.list[wr.i], units = w.u, word = wordOf(w);
  wr.filled = 0; wr.locked = false;
  dots($('#wDots'), ROUND, wr.i);
  $('#wPic').textContent = w.e;
  $('#wPic').classList.toggle('silent', !!wr.cfg.silent);
  const slots = $('#wSlots'); slots.innerHTML = ''; slots.classList.toggle('letters', wr.letters && units.length > 3);
  units.forEach((_, k) => { const s = document.createElement('div'); s.className = 'slot letterfont' + (k === 0 ? ' next' : ''); slots.appendChild(s); });
  const box = $('#wTiles'); box.innerHTML = '';
  shuffle([...units, ...distractors(units)]).forEach(s => {
    const b = document.createElement('button');
    b.className = 'tile letterfont press'; b.innerHTML = colorChars(s);
    b.onclick = () => tapTile(b, s);
    box.appendChild(b);
  });
  const hint = () => [P.say.startsHint, unitSpeech(units[0])];
  const again = () => wr && (wr.cfg.silent ? hint() : [pick(P.say.hearAgain), T(word), wr.letters ? P.say.whichNextLetter : P.say.whichNextSyl]);
  idleCount = 0;
  const intro = first ? levelIntro(wr.cfg, wr.level, null) : [pick(P.say.nextWord)];
  const body = wr.cfg.silent ? [P.say.picOnly] : first ? [P.say.hear, T(word), wr.letters ? P.say.buildNowLetters : P.say.buildNow] : [P.say.listen, T(word)];
  say([...intro, ...body], () => idleStart(again));
}
$('#wPic').onclick = () => {
  if (!wr) return;
  const w = wr.list[wr.i];
  idleStop();
  // em "só imagem" a imagem dá só uma pista: a primeira parte da palavra
  say(wr.cfg.silent ? [P.say.startsHint, unitSpeech(w.u[0])] : T(wordOf(w)));
};
function tapTile(btn, s) {
  if (!wr || wr.locked) return;
  idleStop();
  const w = wr.list[wr.i], units = w.u;
  if (s === units[wr.filled]) {
    sfxTap(); say(unitSpeech(s));
    btn.classList.add('used');
    const slots = $$('#wSlots .slot');
    slots[wr.filled].innerHTML = colorChars(s); slots[wr.filled].classList.remove('next'); slots[wr.filled].classList.add('filled');
    wr.filled++;
    if (wr.filled < units.length) slots[wr.filled].classList.add('next');
    else {
      wr.locked = true;
      const p = praiseText(); liaMood('happy');
      setTimeout(() => { sfxGood(); praiseFx(showText(p)); say([...units.map(unitSpeech), T(wordOf(w)), p], () => setTimeout(nextWord, 400)); }, 450);
    }
  } else {
    wr.mistakes++; shake(btn); sfxBad(); liaMood('think'); idleCount = 0;
    say([unitSpeech(s), P.say.notThat, wr.letters ? P.say.whichNextLetter : P.say.whichNextSyl]);
  }
}
function nextWord() {
  if (!wr) return;
  wr.i++;
  if (wr.i >= ROUND) { const { mistakes, level } = wr; wr = null; finish(mistakes, () => openWords(level), level < P.levels.build.length ? () => openWords(level + 1) : null); return; }
  renderWord(false);
}

/* ---------- 5. Lê a palavra / Lê a frase ---------- */
let rLevel = store.get('rLevel', 1);
function openRead(level = rLevel) {
  const levels = P.levels.read;
  level = Math.min(level, levels.length);
  rLevel = level; store.set('rLevel', level);
  const cfg = levels[level - 1];
  const sentences = cfg.pool === 'sentences';
  const pool = sentences ? P.sentences : P.words[cfg.pool];
  const textOf = x => sentences ? x.s : wordOf(x);
  const shared = (a, b) => sentences ? 0 : a.u.filter(u => b.u.includes(u)).length;
  startQuiz({
    title: P.ui.readTitle, levels, level, onLevel: openRead,
    intro: levelIntro(cfg, level, P.levels.readInstr),
    again: () => openRead(level), next: level < levels.length ? () => openRead(level + 1) : null,
    make: () => shuffle(pool).concat(shuffle(pool)).slice(0, ROUND).map(a => {
      let others = shuffle(pool.filter(x => x !== a && x.e !== a.e));
      if (level > 1 && !sentences) others = others.sort((x, y) => shared(y, a) - shared(x, a)).slice(0, 4);
      // ajuda: pt → sílabas devagar; en → primeira letra; frases → a frase devagar
      const help = sentences ? [T(a.s)]
        : P.mode === 'syllables' ? a.u.map(u => T(sylSpeech(u)))
        : [P.say.startsHint, T(nameOf(a.u[0]))];
      const show = sentences ? esc(a.s) : cfg.split ? a.u.map(s => `<span>${colorChars(s)}</span>`).join('<span class="sep">·</span>') : colorChars(textOf(a));
      return {
        answer: a, options: shuffle([a, ...shuffle(others).slice(0, 2)]), kind: 'pic',
        show, showClass: sentences ? 'sentence' : '',
        prompt: [sentences ? P.say.readSentQ : P.say.readQ], help, echo: T(textOf(a)),
        retry: () => [pick(P.say.retry), P.say.readSlow, ...help]
      };
    })
  });
}

/* ---------- Recompensa ---------- */
let againFn = null, nextFn = null;
function finish(mistakes, again, next) {
  const earned = mistakes === 0 ? 3 : mistakes <= Math.ceil(ROUND * 0.6) ? 2 : 1;
  state.stars += earned; store.set('stars', state.stars);
  againFn = again; nextFn = earned === 3 ? next : null;
  show('reward');
  $('#rNext').style.display = nextFn ? '' : 'none';
  const title = P.ui.rTitles[earned - 1];
  $('#rTitle').textContent = title;
  $$('#rStars span').forEach((s, k) => { s.className = ''; setTimeout(() => { s.classList.add('in'); if (k >= earned) s.classList.add('off'); else tones([660 + k * 180], .12); }, 400 + k * 450); });
  confetti(); liaMood('happy');
  setTimeout(() => updateStars(true), 1800);
  say([N(title, 1), P.say.won[earned - 1], nextFn ? P.say.nextLevel : P.say.playAgain]);
}
$('#rAgain').onclick = () => { sfxTap(); againFn && againFn(); };
$('#rNext').onclick = () => { sfxTap(); nextFn && nextFn(); };

/* ---------- Lista de todas as falas (para gerar o áudio gravado) ---------- */
function speakables(l) {
  const saved = lang; lang = l; P = PACKS[l];
  const out = new Map();
  const add = p => { if (!p) return; if (Array.isArray(p)) return p.forEach(add); if (typeof p === 'object' && !p.t) return; const k = keyOf(p); out.set(k, { key: k, text: typeof p === 'object' ? p.t : p, target: !!(typeof p === 'object' && p.target) }); };
  const walk = o => { if (typeof o === 'string') add(o); else if (Array.isArray(o)) o.forEach(walk); else if (o && typeof o === 'object') Object.values(o).forEach(walk); };
  walk(P.say);
  Object.values(P.levels).forEach(ls => Array.isArray(ls) ? ls.forEach(lv => { add(lv.desc); add(lv.instr); }) : add(ls));
  P.ui.rTitles.forEach(add);
  P.letters.forEach(([l, name, word]) => { add(T(name)); add(P.letterOf(l, name)); add(T(word)); });
  Object.keys(P.names).forEach(k => add(T(nameOf(k))));
  const allWords = ['w1','w2','w3','spell'].flatMap(k => P.words[k] || []);
  allWords.forEach(w => add(T(wordOf(w))));
  P.sentences.forEach(s => add(T(s.s)));
  firstLetterPool().forEach(x => add(T(x.w)));
  if (P.mode === 'syllables') {
    Object.values(VOWEL_SOUND).forEach(v => add(T(v)));
    [...P.easy, ...P.hardFam].forEach(f => VOWELS.forEach(v => add(T(sylSpeech(f + v)))));
    [...P.allSyl, ...P.hardSyl].forEach(s => add(T(sylSpeech(s))));
  } else {
    Object.keys(P.families).forEach(f => add(T(f)));
    P.famWords.forEach(w => add(T(w))); P.digraphWords.forEach(w => add(T(w)));
    Object.values(P.chunks).forEach(c => add(T(c)));
  }
  lang = saved; P = PACKS[saved];
  return [...out.values()];
}
window.speakables = speakables;

/* ---------- Arranque ---------- */
applyLang();
updateStars(false);
document.body.classList.add('on-home');
/* ---------- App instalável e offline ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
